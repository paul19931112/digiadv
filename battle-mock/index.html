<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>戰鬥畫面樣品</title>
<style>
  :root { --accent: #ffcc33; --panel: #141936e6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1124; color: #eef1ff; position: fixed; inset: 0;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; user-select: none; }
  #game { position: absolute; inset: 0; display: flex; flex-direction: column; }

  /* ================= 戰場 ================= */
  #field { position: relative; flex: 1; overflow: hidden; }
  /* 天空與遠景 */
  .sky { position: absolute; inset: 0; background: linear-gradient(180deg, #2b1d4a 0%, #7a3b5c 28%, #e07a4f 46%, #f6b26b 52%); }
  .sun { position: absolute; left: 62%; top: 30%; width: 120px; height: 120px; border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, #fff3c4 0%, #ffb35c 45%, rgba(255,140,60,0) 70%); filter: blur(1px); }
  .far { position: absolute; left: 0; right: 0; top: 34%; height: 22%; }
  .far svg { width: 100%; height: 100%; display: block; }
  /* 地面：透視 */
  .groundWrap { position: absolute; left: -40%; right: -40%; top: 50%; bottom: -10%; perspective: 520px; perspective-origin: 50% 0%; }
  .ground { position: absolute; inset: 0; transform-origin: 50% 0%; transform: rotateX(62deg);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,190,120,.35), transparent 55%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, transparent 2px 80px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 2px, transparent 2px 80px),
      linear-gradient(180deg, #4f7a3a, #3f6a2e 60%, #2f5223); }
  .groundFade { position: absolute; left: 0; right: 0; top: 50%; height: 12%; background: linear-gradient(180deg, rgba(246,178,107,.55), transparent); pointer-events: none; }
  /* 戰場上的對角光帶（像舞台） */
  .stage { position: absolute; left: 50%; top: 66%; width: 130%; height: 34%; transform: translate(-50%, -50%) rotate(-14deg);
    background: radial-gradient(ellipse at center, rgba(255,230,170,.18), transparent 65%); pointer-events: none; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ring { position: absolute; left: 50%; bottom: -9%; width: 110%; height: 22%; transform: translateX(-50%); border-radius: 50%; pointer-events: none;
    border: 2px solid var(--rc); box-shadow: 0 0 14px var(--rc), inset 0 0 14px var(--rc); background: radial-gradient(ellipse, transparent 55%, color-mix(in srgb, var(--rc) 25%, transparent)); opacity: .75; animation: ringP 2s ease-in-out infinite; }
  .ring::after { content: ""; position: absolute; inset: 16%; border-radius: 50%; border: 1.5px dashed var(--rc); animation: spin 8s linear infinite; }
  @keyframes ringP { 50% { opacity: .45; } } @keyframes spin { to { transform: rotate(360deg); } }
  .unit[data-slot] .ring { --rc: #38bdf8; } #enemy .ring { --rc: #ff4d4d; }
  .unit.bench .ring { display: none; } .unit.bench .miniHp { width: 44px; height: 5px; }
  .unit { transition: left .35s cubic-bezier(.3,.8,.4,1), top .35s cubic-bezier(.3,.8,.4,1), height .35s, opacity .35s, filter .35s; }
  .unit.arrive img { animation: arrive .45s ease-out; } @keyframes arrive { 0% { transform: translateY(-14%) scale(.9); } 60% { transform: translateY(3%) scale(1.04); } 100% { transform: none; } }
  .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 160px rgba(0,0,0,.65); pointer-events: none; }

  /* 角色 */
  .unit { position: absolute; transform: translate(-50%, -100%); transition: left .28s cubic-bezier(.3,.8,.4,1), top .28s cubic-bezier(.3,.8,.4,1); }
  .unit .shadow { position: absolute; left: 50%; bottom: -6%; width: 78%; height: 16%; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%); }
  .unit img { display: block; height: 100%; width: auto; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); animation: breathe 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
  .unit.flip img { transform: scaleX(-1); animation-name: breatheFlip; }
  @keyframes breathe { 50% { transform: translateY(-2.5%) scaleY(1.01); } }
  @keyframes breatheFlip { 0%, 100% { transform: scaleX(-1); } 50% { transform: scaleX(-1) translateY(-2.5%) scaleY(1.01); } }
  .unit.hit img { filter: brightness(3) drop-shadow(0 0 10px #fff); }
  .unit.shake { animation: shake .3s; }
  @keyframes shake { 20% { margin-left: -10px; } 40% { margin-left: 9px; } 60% { margin-left: -6px; } 80% { margin-left: 4px; } }
  .unit.bench { opacity: .78; filter: saturate(.8) brightness(.85); z-index: 1; } .unit:not(.bench) { z-index: 2; }
  .unit.boss .aura { position: absolute; left: 50%; bottom: 0; width: 120%; height: 30%; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,80,40,.55), transparent 70%); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; transform: translateX(-50%) scale(1.15); } }

  /* 頭頂資訊 */
  .tag { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 6px; min-width: 150px; text-align: left;
    background: var(--panel); border: 1.5px solid #4b5394; border-radius: 10px; padding: 5px 8px 6px; box-shadow: 0 4px 10px #0008; white-space: nowrap; }
  .tag .nm { font-size: 13px; font-weight: 900; display: flex; align-items: center; gap: 5px; }
  .tag .nm small { color: #9aa3d6; font-weight: 700; }
  .tag .boss { background: #b91c1c; color: #fff; font-size: 10px; border-radius: 5px; padding: 0 5px; }
  .tag .attr { margin-left: auto; font-size: 11px; color: #c7cdf5; }
  .bar { height: 8px; border-radius: 4px; background: #0008; overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; border-radius: 4px; }
  .bar.hp i { background: linear-gradient(90deg, #22c55e, #4ade80); }
  .bar.hp.e i { background: linear-gradient(90deg, #ef4444, #f87171); }
  .bar.atb { height: 5px; } .bar.atb i { background: linear-gradient(90deg, #38bdf8, #a5f3fc); }
  .bar.atb.e i { background: linear-gradient(90deg, #f97316, #fdba74); }
  .tag .hpn { font-size: 10px; color: #c7cdf5; margin-top: 2px; display: flex; justify-content: space-between; }
  .sts { display: flex; gap: 3px; margin-top: 3px; } .sts span { font-size: 10px; background: #262d5a; border-radius: 5px; padding: 0 4px; }
  .intent { display: inline-block; background: #fff; color: #111; font-weight: 900; font-size: 12px; border-radius: 8px; padding: 2px 8px; margin-bottom: 4px; white-space: nowrap; }
  .benchTag { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 2px; width: 56px; }
  .benchTag .bar { margin: 0; height: 5px; }


  /* 固定位置的資訊框 */
  .fixPanel { position: absolute; z-index: 4; min-width: 170px; background: var(--panel); border: 1.5px solid #4b5394; border-radius: 10px; padding: 6px 9px 7px; box-shadow: 0 4px 10px #0008; }
  .fixPanel .nm { font-size: 13px; font-weight: 900; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .fixPanel .nm small { color: #9aa3d6; font-weight: 700; }
  .fixPanel .boss { background: #b91c1c; color: #fff; font-size: 10px; border-radius: 5px; padding: 0 5px; }
  .fixPanel .attr { margin-left: auto; font-size: 11px; color: #c7cdf5; }
  .fixPanel .hpn { font-size: 10px; color: #c7cdf5; margin-top: 2px; display: flex; justify-content: space-between; gap: 8px; }
  .fixPanel.e { left: 10px; top: 46px; border-color: #b91c1c88; }
  .fixPanel.p { left: 10px; bottom: 40px; border-color: #38bdf888; }
  .miniHp { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 4px; width: 60px; height: 6px; border-radius: 3px; background: #000a; overflow: hidden; }
  .miniHp i { display: block; height: 100%; background: #f87171; } .miniHp.p i { background: #4ade80; }
  .label { transition: opacity .6s; }

  /* ===== 各種技能的動畫 ===== */
  .shieldFx { position: absolute; width: 150px; height: 170px; transform: translate(-50%, -50%) scale(.2); opacity: 0; pointer-events: none;
    transition: transform .25s cubic-bezier(.2,1.6,.4,1), opacity .25s; filter: drop-shadow(0 0 12px #7dd3fc); }
  .shieldFx.on { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .shieldFx.off { opacity: 0; transform: translate(-50%, -50%) scale(1.2); transition: opacity .4s, transform .4s; }
  .healP { position: absolute; width: 10px; height: 10px; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%);
    background: radial-gradient(circle, #fff, #4ade80 50%, rgba(74,222,128,0) 70%); animation: healUp 1.1s ease-out forwards; }
  @keyframes healUp { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) translateY(-120px) scale(.6); } }
  .healRing { position: absolute; width: 160px; height: 40px; transform: translate(-50%, -50%); border-radius: 50%; border: 3px solid #4ade80;
    box-shadow: 0 0 20px #4ade80; pointer-events: none; animation: healRing .9s ease-out forwards; }
  @keyframes healRing { from { opacity: 1; transform: translate(-50%, -50%) scale(.4); } to { opacity: 0; transform: translate(-50%, -50%) scale(1.4); } }
  .dmg.heal { color: #bbf7d0; text-shadow: 0 0 4px #000, 0 3px 0 #15803d; }
  .dmg.buff { color: #fecaca; font-size: 22px; text-shadow: 0 0 4px #000, 0 2px 0 #7f1d1d; }
  .dmg.big { font-size: 56px; color: #fde68a; text-shadow: 0 0 8px #000, 0 4px 0 #b45309; }
  .reticle { position: absolute; width: 150px; height: 150px; transform: translate(-50%, -50%) rotate(0) scale(2); opacity: 0; pointer-events: none;
    border: 3px solid #f87171; border-radius: 50%; box-shadow: 0 0 14px #ef4444; transition: transform .45s cubic-bezier(.2,.8,.3,1), opacity .2s; }
  .reticle::before, .reticle::after { content: ''; position: absolute; background: #f87171; }
  .reticle::before { left: 50%; top: -18px; bottom: -18px; width: 3px; transform: translateX(-50%); }
  .reticle::after { top: 50%; left: -18px; right: -18px; height: 3px; transform: translateY(-50%); }
  .reticle.on { opacity: 1; transform: translate(-50%, -50%) rotate(135deg) scale(.7); }
  .reticle.lock { border-color: #fff; box-shadow: 0 0 24px #fff; }
  .cutin { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
  .cutin .dim { position: absolute; inset: 0; background: rgba(0,0,0,.6); opacity: 0; transition: opacity .2s; }
  .cutin .band { position: absolute; left: -10%; right: -10%; top: 32%; height: 34%; transform: skewY(-8deg) translateX(110%);
    background: linear-gradient(90deg, rgba(249,115,22,0), #f97316 15%, #fbbf24 50%, #f97316 85%, rgba(249,115,22,0));
    box-shadow: 0 0 40px #f97316; transition: transform .28s cubic-bezier(.2,.9,.3,1); overflow: hidden; }
  .cutin .band::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 4px, transparent 4px 26px); animation: speed .3s linear infinite; }
  @keyframes speed { to { transform: translateX(-26px); } }
  .cutin .band img { position: absolute; left: 14%; top: -18%; height: 150%; transform: skewY(8deg) scaleX(-1); filter: drop-shadow(0 0 16px #fff); }
  .cutin .band .nm { position: absolute; right: 16%; top: 50%; transform: translateY(-50%) skewY(8deg); font-size: clamp(28px, 6vw, 60px); font-weight: 900; color: #fff;
    text-shadow: 0 0 10px #b45309, 0 4px 0 #7c2d12; letter-spacing: 4px; white-space: nowrap; }
  .cutin.on .dim { opacity: 1; } .cutin.on .band { transform: skewY(-8deg) translateX(0); }
  .cutin.out .band { transform: skewY(-8deg) translateX(-120%); transition: transform .22s ease-in; }
  .cutin.out .dim { opacity: 0; }
  .meteor { position: absolute; width: 130px; height: 130px; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
    background: radial-gradient(circle, #fff 0%, #ffe08a 25%, #ff7a1a 55%, rgba(255,60,0,0) 72%); box-shadow: 0 0 60px 30px rgba(255,110,30,.7); }
  .boom { position: absolute; width: 60px; height: 60px; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
    background: radial-gradient(circle, #fff, #ffd27a 30%, #ff6a00 55%, rgba(255,60,0,0) 70%); animation: boom .6s ease-out forwards; }
  @keyframes boom { from { opacity: 1; transform: translate(-50%, -50%) scale(.5); } to { opacity: 0; transform: translate(-50%, -50%) scale(6); } }
  #field.quake { animation: quake .5s; } @keyframes quake { 10%, 50%, 90% { transform: translate(-6px, 3px); } 30%, 70% { transform: translate(6px, -3px); } }
  /* 特效 */
  .fx { position: absolute; pointer-events: none; }
  .fireball { width: 44px; height: 44px; border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, #fff 0%, #ffd27a 30%, #ff7a1a 60%, rgba(255,90,0,0) 72%); box-shadow: 0 0 30px 10px rgba(255,120,30,.6); }
  .slash { width: 140px; height: 140px; transform: translate(-50%, -50%) rotate(-30deg); border-radius: 50%;
    border-top: 6px solid #fff; filter: drop-shadow(0 0 8px #ffcc33); animation: slashA .25s ease-out forwards; }
  @keyframes slashA { from { opacity: 1; transform: translate(-50%, -50%) rotate(-80deg) scale(.6); } to { opacity: 0; transform: translate(-50%, -50%) rotate(20deg) scale(1.2); } }
  .dmg { position: absolute; transform: translate(-50%, -50%); font-size: 34px; font-weight: 900; color: #fff; pointer-events: none;
    text-shadow: 0 0 4px #000, 0 3px 0 #b91c1c; animation: dmgUp .8s ease-out forwards; }
  @keyframes dmgUp { 0% { transform: translate(-50%, -50%) scale(.6); } 20% { transform: translate(-50%, -80%) scale(1.25); } 100% { transform: translate(-50%, -170%) scale(1); opacity: 0; } }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .15s; }

  /* 角落 */
  .corner { position: absolute; top: 10px; display: flex; gap: 6px; z-index: 5; }
  .corner.l { left: 10px; } .corner.r { right: 10px; }
  .chip { background: var(--panel); border: 1.5px solid #4b5394; border-radius: 10px; padding: 5px 10px; font-size: 12px; font-weight: 800; }
  .chip.dom { border-color: #ef4444; color: #fecaca; }
  .log { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: #0b0e20b3; border-radius: 10px; padding: 4px 14px;
    font-size: 12px; color: #dfe3ff; white-space: nowrap; }

  /* ================= 下方：手牌與按鈕（跟現在的遊戲一樣） ================= */
  #bottom { background: linear-gradient(180deg, #121633, #0e1124); border-top: 2px solid #2b3270; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); display: flex; gap: 12px; align-items: flex-end; }
  .orb { width: 64px; height: 64px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900;
    background: radial-gradient(circle at 35% 30%, #fff6c4, #ffcc33 55%, #b8860b); color: #3a2000; box-shadow: 0 0 18px #ffcc3388; }
  .hand { display: flex; gap: 8px; flex: 1; overflow-x: auto; padding-top: 12px; }
  .card { width: 104px; height: 138px; flex: none; border-radius: 10px; background: #f7f5ee; color: #1d1d2e; border: 3px solid var(--c, #888); position: relative; padding: 22px 7px 6px; }
  .card .cost { position: absolute; top: -9px; left: -8px; width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c4, #ffb300 60%, #a35d00);
    border: 2px solid #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .card .ct { position: absolute; top: 4px; right: 5px; font-size: 9px; color: #fff; background: var(--c); border-radius: 5px; padding: 0 5px; }
  .card b { display: block; text-align: center; font-size: 14px; } .card p { margin: 6px 0 0; font-size: 11px; text-align: center; line-height: 1.4; }
  .card.atk { --c: #e5594a; } .card.skill { --c: #3f8fe0; } .card.sig { --c: #f2992b; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: none; width: 250px; }
  .btn { border: none; border-radius: 10px; padding: 9px 8px; font-size: 13px; font-weight: 800; background: #262d5a; color: #eef1ff; cursor: pointer; font-family: inherit; }
  .btn.evo { background: linear-gradient(90deg, #f472b6, #fb923c); } .btn.end { background: linear-gradient(180deg, #ffd84d, #f5a300); color: #3a2000; }

  /* 樣品用的控制列 */
  .demo { position: fixed; right: 10px; top: 50px; display: flex; flex-direction: column; gap: 6px; z-index: 20; }
  .demo button { border: 2px solid #ffcc33; background: #1a1f3dee; color: #ffcc33; font-weight: 900; border-radius: 10px; padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .themes { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .themes select { border: 2px solid #93c5fd; background: #1a1f3dee; color: #bfdbfe; font-weight: 900; border-radius: 10px; padding: 5px 6px; font-size: 12px; font-family: inherit; }
  @media (orientation: portrait) and (max-width: 700px) { .demo { top: 40px; gap: 4px; display: grid; grid-template-columns: 1fr 1fr; width: 170px; } .demo button { padding: 4px 6px; font-size: 10px; } .themes { grid-column: 1 / -1; margin-top: 2px; } }
  .label { position: fixed; left: 50%; top: 48px; transform: translateX(-50%); background: #ffcc33; color: #3a2000; font-weight: 900; font-size: 12px; border-radius: 8px; padding: 2px 10px; z-index: 20; }

  /* ================= 手機直拿 ================= */
  @media (orientation: portrait) and (max-width: 700px) {
    #bottom { flex-wrap: wrap; gap: 8px; }
    .hand { order: 1; flex-basis: 100%; }
    .orb { order: 2; width: 52px; height: 52px; font-size: 24px; }
    .btns { order: 3; flex: 1; width: auto; }
    .card { width: 88px; height: 116px; padding-top: 18px; } .card p { font-size: 10px; }
    .fixPanel { min-width: 140px; padding: 4px 7px 5px; } .fixPanel .nm { font-size: 11px; } .fixPanel .attr { display: none; } .fixPanel.e { top: 38px; } .fixPanel.p { bottom: 36px; } .corner { top: 6px; } .chip { padding: 3px 7px; font-size: 11px; }
    .intent { font-size: 11px; }
    .sun { width: 80px; height: 80px; }
  }
</style>
</head>
<body>
<div id="game">
  <div id="field">
    <canvas id="bg"></canvas>

    <!-- 敵人：左上 -->
    <div class="unit flip boss" id="enemy" data-slot="enemy">
      <div class="ring"></div><div class="aura"></div><div class="shadow"></div>
      <img src="../images/Meramon.png" alt="">
      <div class="miniHp"><i style="width:78%"></i></div>
    </div>

    <!-- 我方：最多 3 隻站在戰場上（data-slot：front 出戰、b1／b2 後排） -->
    <div class="unit bench" data-slot="b1" data-sp="Gabumon" data-name="加布獸" data-lv="5" data-hp="92" data-max="92" data-attr="💾 資料種">
      <div class="ring"></div><div class="shadow"></div><img src="../images/Gabumon.png" alt=""><div class="miniHp p"><i style="width:100%"></i></div>
    </div>
    <div class="unit bench" data-slot="b2" data-sp="Piyomon" data-name="比丘獸" data-lv="5" data-hp="49" data-max="76" data-attr="💉 疫苗種">
      <div class="ring"></div><div class="shadow"></div><img src="../images/Piyomon.png" alt=""><div class="miniHp p"><i style="width:64%"></i></div>
    </div>
    <div class="unit" data-slot="front" data-sp="Agumon" data-name="亞古獸" data-lv="5" data-hp="75" data-max="87" data-attr="💉 疫苗種">
      <div class="ring"></div><div class="shadow"></div><img src="../images/Agumon.png" alt=""><div class="miniHp p"><i style="width:86%"></i></div>
    </div>

    <!-- 固定位置的資訊框（攻擊時不會跟著角色移動） -->
    <div class="fixPanel e" id="ePanel"><div class="intent">下一招 ⚔️ 火焰拳 39 🔥</div><div class="nm">火焰獸 <small>Lv.5</small><span class="boss">頭目</span><span class="attr">💾 資料種</span></div>
        <div class="bar hp e"><i style="width:78%"></i></div><div class="hpn"><span>283 / 362</span><span>速度 11.6</span></div>
        <div class="bar atb e"><i style="width:55%"></i></div>
        <div class="sts"><span>💪 攻擊↑ 2</span></div></div>
    <div class="fixPanel p" id="pPanel"><div class="nm"><span id="pName">亞古獸</span> <small id="pLv">Lv.5</small><span class="attr" id="pAttr">💉 疫苗種</span></div>
        <div class="bar hp"><i id="pHpBar" style="width:86%"></i></div><div class="hpn"><span id="pHp">75 / 87</span><span>🔥 勇氣 48</span></div>
        <div class="bar atb"><i style="width:100%"></i></div>
        <div class="sts"><span>🛡 13</span></div></div>
    <div class="corner l"><div class="chip dom">🔥 灼熱之軀 ⓘ</div><div class="chip">☀️🔥</div></div>
    <div class="corner r"><div class="chip">🔊</div><div class="chip">❓ 說明</div></div>
    <div class="log">亞古獸 的回合！</div>
    <div class="vignette"></div>
    <div class="flash" id="flash"></div>
  </div>

  <div id="bottom">
    <div class="orb">3</div>
    <div class="hand">
      <div class="card atk"><div class="cost">1</div><div class="ct">⚔️ 攻擊</div><b>撞擊</b><p>造成 <b style="display:inline;color:#c0392b">8</b> 傷害</p></div>
      <div class="card sig"><div class="cost">2</div><div class="ct">✴️ 必殺</div><b>小火球</b><p>造成 <b style="display:inline;color:#c0392b">17</b> 傷害<br>40% 燒傷</p></div>
      <div class="card skill"><div class="cost">1</div><div class="ct">🛡️ 技能</div><b>防禦</b><p>獲得 13 護盾</p></div>
      <div class="card atk"><div class="cost">1</div><div class="ct">⚔️ 攻擊</div><b>連續攻擊</b><p>造成 5 ×2 傷害</p></div>
      <div class="card skill"><div class="cost">0</div><div class="ct">🔥 技能</div><b>鼓起勇氣</b><p>勇氣值 +8<br>抽 1 張牌</p></div>
    </div>
    <div class="btns">
      <button class="btn evo">✨ 進化 (E)</button><button class="btn end">結束回合</button>
      <button class="btn">🤝 頭目不聽勸</button><button class="btn">🎒 道具 2</button>
    </div>
  </div>
</div>

<div class="label">樣品畫面（不是遊戲本體）</div>
<div class="demo">
  <button id="dAtk">▶ 我方攻擊</button>
  <button id="dFire">▶ 必殺技</button>
  <button id="dEnemy">▶ 敵人攻擊</button>
  <button id="dEvo">▶ 進化</button>
  <button id="dSwitch">▶ 換手</button>
  <button id="dMulti">▶ 連續攻擊</button>
  <button id="dShield">▶ 護盾</button>
  <button id="dHeal">▶ 回復</button>
  <button id="dDebuff">▶ 干擾敵人</button>
  <button id="dUlt">▶ 究極技特寫</button>
  <div class="themes" id="themes"></div>
</div>

<script src="scene.js?v=2"></script>
<script>
const $ = s => document.querySelector(s);
const field = $('#field');
// 依 data-x / data-y（戰場的百分比位置）和 data-h（身高佔戰場高度的百分比）擺放
// 站位：依 slot 決定（電腦／手機直拿各一組），[x%, y%, 身高佔戰場高度 %]
const SLOTS = { enemy: { d: [28, 60, 32], p: [30, 60, 25] }, front: { d: [68, 88, 26], p: [62, 94, 23.4] },
                b1: { d: [86, 72, 15], p: [88, 74, 12.8] }, b2: { d: [92, 86, 14], p: [91, 88, 11.9] } };
function place(el) {
  const W = field.clientWidth, H = field.clientHeight, portrait = H > W;
  let [x, y, h] = SLOTS[el.dataset.slot][portrait ? 'p' : 'd'];
  h *= +(el.dataset.scale || 1);
  el.style.left = x + '%'; el.style.top = y + '%';
  el.style.height = (H * h / 100) + 'px';
  el.querySelector('img').style.height = '100%';
  el.dataset.homeX = x; el.dataset.homeY = y;
}
const units = [...document.querySelectorAll('.unit')];
const front = () => document.querySelector('.unit[data-slot="front"]');
function layout() { units.forEach(place); }
addEventListener('resize', layout); layout();
Scene.init($('#bg'));
const themeBox = $('#themes');
const sel = document.createElement('select'); sel.innerHTML = Object.entries(SCENES).map(([k, sc]) => `<option value="${k}">${sc.name}</option>`).join(''); sel.onchange = () => Scene.set(sel.value); themeBox.appendChild(sel);
setTimeout(() => $('.label').style.opacity = 0, 3500);

const sleep = ms => new Promise(r => setTimeout(r, ms));
const center = el => { const r = el.getBoundingClientRect(), f = field.getBoundingClientRect(); return { x: r.left - f.left + r.width / 2, y: r.top - f.top + r.height * .55 }; };
function dmg(el, n) { const c = center(el), d = document.createElement('div'); d.className = 'dmg'; d.textContent = n; d.style.left = c.x + 'px'; d.style.top = c.y + 'px'; field.appendChild(d); setTimeout(() => d.remove(), 800); }
async function hit(el, n) { el.classList.add('hit', 'shake'); dmg(el, n); await sleep(110); el.classList.remove('hit'); await sleep(200); el.classList.remove('shake'); }
async function dash(el, target, ratio) {   // 沿對角線衝向目標，再退回原位
  const hx = +el.dataset.homeX, hy = +el.dataset.homeY, tx = +target.dataset.homeX, ty = +target.dataset.homeY;
  el.style.left = (hx + (tx - hx) * ratio) + '%'; el.style.top = (hy + (ty - hy) * ratio) + '%';
  await sleep(280);
}
function home(el) { el.style.left = el.dataset.homeX + '%'; el.style.top = el.dataset.homeY + '%'; }
let busy = false;
const run = fn => async () => { if (busy) return; busy = true; try { await fn(); } finally { busy = false; } };

$('#dAtk').onclick = run(async () => {
  const H = front(), E = $('#enemy');
  await dash(H, E, .62);
  const c = center(E), s = document.createElement('div'); s.className = 'fx slash'; s.style.left = c.x + 'px'; s.style.top = c.y + 'px'; field.appendChild(s); setTimeout(() => s.remove(), 300);
  await hit(E, 8); home(H); await sleep(300);
});
$('#dFire').onclick = run(async () => {
  const H = front(), E = $('#enemy'), a = center(H), b = center(E);
  H.classList.add('shake'); await sleep(200); H.classList.remove('shake');
  const f = document.createElement('div'); f.className = 'fx fireball'; f.style.left = a.x + 'px'; f.style.top = a.y + 'px'; field.appendChild(f);
  const t0 = performance.now(), dur = 420;
  await new Promise(res => { const step = now => { const k = Math.min(1, (now - t0) / dur), arc = Math.sin(k * Math.PI) * -60;
    f.style.left = (a.x + (b.x - a.x) * k) + 'px'; f.style.top = (a.y + (b.y - a.y) * k + arc) + 'px'; k < 1 ? requestAnimationFrame(step) : res(); }; requestAnimationFrame(step); });
  f.remove(); $('#flash').style.opacity = .5; setTimeout(() => $('#flash').style.opacity = 0, 90);
  await hit(E, 17); await sleep(200);
});
$('#dEnemy').onclick = run(async () => {
  const H = front(), E = $('#enemy');
  await dash(E, H, .55); await hit(H, 39); home(E); await sleep(300);
});
const EVO = { Agumon: ['Greymon', '暴龍獸'], Gabumon: ['Garurumon', '加魯魯獸'], Piyomon: ['Birdramon', '巴多拉獸'] };
function devolveUnit(u) {   // 換下場時退化
  if (!u.dataset.evo) return;
  u.querySelector('img').src = `../images/${u.dataset.sp}.png`; u.dataset.scale = 1; delete u.dataset.evo;
}
function showPanel(u) {
  $('#pName').textContent = u.dataset.evo ? EVO[u.dataset.sp][1] : u.dataset.name; $('#pLv').textContent = 'Lv.' + u.dataset.lv; $('#pAttr').textContent = u.dataset.attr;
  $('#pHp').textContent = `${u.dataset.hp} / ${u.dataset.max}`; $('#pHpBar').style.width = (u.dataset.hp / u.dataset.max * 100) + '%';
}
$('#dEvo').onclick = run(async () => {
  const H = front(), img = H.querySelector('img'), ev = EVO[H.dataset.sp];
  $('#flash').style.transition = 'opacity .4s'; $('#flash').style.opacity = .85; await sleep(420);
  if (H.dataset.evo) devolveUnit(H);
  else { img.src = `../images/${ev[0]}.png`; H.dataset.scale = 1.38; H.dataset.evo = 1; }
  place(H); showPanel(H);
  $('#flash').style.opacity = 0; await sleep(450); $('#flash').style.transition = 'opacity .15s';
  $('.log').textContent = H.dataset.evo ? `✨ ${H.dataset.name} 進化——${ev[1]}！` : `${H.dataset.name} 的回合！`;
});
// 換手：出戰的退到最後面，後排第一隻走到前面（三隻輪流）
function doSwitch() {
  const F = front(), N = document.querySelector('.unit[data-slot="b1"]'), L = document.querySelector('.unit[data-slot="b2"]');
  $('.log').textContent = `${F.dataset.name} 退下，換 ${N.dataset.name} 上場！`;
  devolveUnit(F);
  F.dataset.slot = 'b2'; F.classList.add('bench'); place(F);
  L.dataset.slot = 'b1'; place(L);
  setTimeout(() => {
    N.dataset.slot = 'front'; N.classList.remove('bench'); place(N);
    N.classList.remove('arrive'); void N.offsetWidth; N.classList.add('arrive');
    showPanel(N);
  }, 180);
}
$('#dSwitch').onclick = run(async () => { doSwitch(); await sleep(650); });

// ===== 各種技能的動畫 =====
function dmgCls(el, text, cls, dy = 0) { const c = center(el), d = document.createElement('div'); d.className = 'dmg ' + cls; d.textContent = text; d.style.left = c.x + 'px'; d.style.top = (c.y + dy) + 'px'; field.appendChild(d); setTimeout(() => d.remove(), 900); }
const HEX = `<svg viewBox="0 0 150 170"><defs><pattern id="hx" width="26" height="30" patternUnits="userSpaceOnUse"><path d="M13 0 L26 7.5 L26 22.5 L13 30 L0 22.5 L0 7.5 Z" fill="rgba(125,211,252,.18)" stroke="#bae6fd" stroke-width="1.5"/></pattern></defs>
  <path d="M75 4 L146 44 L146 126 L75 166 L4 126 L4 44 Z" fill="url(#hx)" stroke="#e0f2fe" stroke-width="4"/></svg>`;
// 🛡️ 護盾：身前展開六角形的盾
$('#dShield').onclick = run(async () => {
  const H = front(), E = $('#enemy'), a = center(H), b = center(E);
  const sh = document.createElement('div'); sh.className = 'shieldFx'; sh.innerHTML = HEX;
  sh.style.left = (a.x + (b.x - a.x) * .18) + 'px'; sh.style.top = (a.y + (b.y - a.y) * .18) + 'px'; field.appendChild(sh);
  await sleep(20); sh.classList.add('on'); dmgCls(H, '+13 🛡', 'buff', -40);
  $('.log').textContent = `${H.dataset.name} 使用了「防禦」，獲得 13 護盾！`;
  await sleep(900); sh.classList.add('off'); await sleep(400); sh.remove();
});
// 💚 回復：綠色光點從腳下往上飄
$('#dHeal').onclick = run(async () => {
  const H = front(), r = H.getBoundingClientRect(), f = field.getBoundingClientRect(), fx = r.left - f.left + r.width / 2, fy = r.bottom - f.top;
  const ring = document.createElement('div'); ring.className = 'healRing'; ring.style.left = fx + 'px'; ring.style.top = fy + 'px'; field.appendChild(ring); setTimeout(() => ring.remove(), 900);
  for (let i = 0; i < 22; i++) setTimeout(() => { const p = document.createElement('div'); p.className = 'healP'; p.style.left = (fx + (Math.random() - .5) * r.width * .9) + 'px'; p.style.top = (fy - Math.random() * r.height * .4) + 'px'; field.appendChild(p); setTimeout(() => p.remove(), 1100); }, i * 35);
  await sleep(300); dmgCls(H, '+18', 'heal');
  $('.log').textContent = `${H.dataset.name} 回復了 18 HP！`;
  await sleep(700);
});
// 🎯 干擾敵人：弱點分析（準星鎖定）
$('#dDebuff').onclick = run(async () => {
  const E = $('#enemy'), c = center(E);
  const rt = document.createElement('div'); rt.className = 'reticle'; rt.style.left = c.x + 'px'; rt.style.top = c.y + 'px'; field.appendChild(rt);
  await sleep(20); rt.classList.add('on'); await sleep(480); rt.classList.add('lock');
  dmgCls(E, '🎯 受傷↑', 'buff', -30);
  const sts = $('#ePanel .sts'); if (!sts.textContent.includes('受傷')) sts.insertAdjacentHTML('beforeend', '<span>🎯 受傷↑ 2</span>');
  $('.log').textContent = '弱點分析！火焰獸受到的傷害提升了！';
  await sleep(500); rt.style.opacity = 0; await sleep(250); rt.remove();
});
// ⚔️ 連續攻擊：衝過去連打 3 下
$('#dMulti').onclick = run(async () => {
  const H = front(), E = $('#enemy');
  await dash(H, E, .62);
  for (let i = 0; i < 3; i++) {
    const c = center(E), s = document.createElement('div'); s.className = 'fx slash';
    s.style.left = (c.x + (Math.random() - .5) * 40) + 'px'; s.style.top = (c.y + (Math.random() - .5) * 40) + 'px'; s.style.rotate = (i * 50 - 50) + 'deg';
    field.appendChild(s); setTimeout(() => s.remove(), 300);
    E.classList.add('hit'); dmgCls(E, '5', '', i * -26); await sleep(90); E.classList.remove('hit'); await sleep(110);
  }
  E.classList.add('shake'); await sleep(250); E.classList.remove('shake');
  home(H); await sleep(300);
  $('.log').textContent = `${H.dataset.name} 的連續攻擊！`;
});
// ✨ 究極技：招式特寫 → 巨大火球從天而降
$('#dUlt').onclick = run(async () => {
  const H = front(), E = $('#enemy'), img = H.querySelector('img').src;
  const names = { Agumon: '超級火焰', Gabumon: '狐火', Piyomon: '流星之翼' };
  const cut = document.createElement('div'); cut.className = 'cutin';
  cut.innerHTML = `<div class="dim"></div><div class="band"><img src="${img}" alt=""><div class="nm">${names[H.dataset.sp] || '究極技'}！</div></div>`;
  field.appendChild(cut); await sleep(20); cut.classList.add('on');
  await sleep(1000); cut.classList.add('out'); await sleep(260); cut.remove();
  const b = center(E), m = document.createElement('div'); m.className = 'meteor'; field.appendChild(m);
  const sx = b.x + 160, sy = -120, t0 = performance.now(), dur = 380;
  await new Promise(res => { const step = now => { const k = Math.min(1, (now - t0) / dur); m.style.left = (sx + (b.x - sx) * k) + 'px'; m.style.top = (sy + (b.y - sy) * k) + 'px'; k < 1 ? requestAnimationFrame(step) : res(); }; requestAnimationFrame(step); });
  m.remove();
  const bm = document.createElement('div'); bm.className = 'boom'; bm.style.left = b.x + 'px'; bm.style.top = b.y + 'px'; field.appendChild(bm); setTimeout(() => bm.remove(), 600);
  $('#flash').style.opacity = .8; setTimeout(() => $('#flash').style.opacity = 0, 120);
  field.classList.remove('quake'); void field.offsetWidth; field.classList.add('quake');
  E.classList.add('hit', 'shake'); dmgCls(E, '142', 'big'); await sleep(150); E.classList.remove('hit'); await sleep(400); E.classList.remove('shake');
  $('.log').textContent = `${H.dataset.name} 的究極技「${names[H.dataset.sp] || '究極技'}」！`;
});
</script>
</body>
</html>
